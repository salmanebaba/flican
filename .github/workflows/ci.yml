name: Flican CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flican-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    name: Unit tests and wheel (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      FLICAN_CHECKOV_DOCKER_TESTS: '0'
      FLICAN_SEMGREP_DOCKER_TESTS: '0'
      FLICAN_APPLICATION_DOCKER_TESTS: '0'
      FLICAN_DOJO_LIVE_TESTS: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Verify wheel contents
        run: python tests/helpers/verify_wheel.py dist/*.whl
      - name: Install built wheel
        run: python -m pip install dist/*.whl
      - name: Verify installed command
        run: |
          python -I - <<'PY'
          from pathlib import Path
          import sysconfig
          import flican

          origin = Path(flican.__file__).resolve()
          site_packages = Path(sysconfig.get_path("purelib")).resolve()
          if not origin.is_relative_to(site_packages):
              raise SystemExit(f"Expected an installed wheel, got {origin}")
          print(f"Installed Flican: {origin}")
          PY
          flican --help
      - name: Run unit tests against installed wheel
        env:
          FLICAN_STATE_DIR: ${{ runner.temp }}/flican-ci-state
        run: python -I -m unittest discover -s tests -q
      - name: Record wheel checksum
        run: |
          cd dist
          sha256sum *.whl > SHA256SUMS
      - name: Upload tested wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: flican-wheel-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
