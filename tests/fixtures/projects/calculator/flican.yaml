schema_version: 1

project:
  name: mini-calculator
  exclude:
    - .git
    - .venv
    - __pycache__
    - .flican

scanners:
  - gitleaks
  - semgrep
  - trivy
  - checkov

policy:
  fail_on: high

tests:
  image: python:3.12-slim-bookworm@sha256:e697c81897302a4c4333bade000d98038fbb21eb064f8ee1fd42d02ebcd9d337
  command: [python, -m, unittest, discover, -s, tests, -v]
  timeout_seconds: 60
  network: none

build:
  backend: buildkit
  context: .
  dockerfile: Dockerfile.build
  platform: linux/amd64
  network: none
  timeout_seconds: 600
